[package]
name = "ostk-cache"
version = "0.1.0"
edition = "2024"

[dependencies]
ostk-files-light = { path = "../haystack/crates/ostk-files-light" }
# →1781: page-table type surface (Page, PageState). The kernel crate is
# canonical; ostk-cache (the federation probe) reconciles to it via this
# membrane. Replaced the local Page/PageState definitions in src/lib.rs
# at the carve.
ostk-page = { path = "../haystack/crates/ostk-page" }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
dashmap = "5.5"
bytes = "1.0"
axum = "0.7"
async-stream = "0.3"
clap = { version = "4.6.1", features = ["derive"] }
flate2 = "1.0"

[dev-dependencies]
tempfile = "3"
