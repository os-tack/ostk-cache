name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build and upload
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: ostk-cache
            asset_name: ostk-cache-linux-amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: ostk-cache
            asset_name: ostk-cache-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: ostk-cache
            asset_name: ostk-cache-macos-arm64
          # Windows dropped from the matrix: ostk-cache uses tokio::net::UnixStream
          # for the scan-trigger socket (and Unix-fork semantics in serve), which
          # is not portable to Windows. Restoring Windows support requires an IPC
          # redesign (named pipes / TCP loopback) — out of scope for the build-fix
          # wave. Linux + macOS are the supported targets today.

    steps:
    - uses: actions/checkout@v4

    - name: Configure git auth for private os-tack/haystack git-deps
      env:
        OSTK_CRATES: ${{ secrets.OSTK_CRATES }}
      shell: bash
      run: |
        git config --global url."https://x-access-token:${OSTK_CRATES}@github.com/".insteadOf "https://github.com/"

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Cache Cargo registry
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-release-

    - name: Build Release
      run: cargo build --release --target ${{ matrix.target }}

    - name: Upload binaries to release
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
        asset_name: ${{ matrix.asset_name }}
        tag: ${{ github.ref }}
        overwrite: true
