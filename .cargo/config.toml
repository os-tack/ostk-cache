# Use the system git CLI for fetching git deps. Cargo's bundled libgit2
# fetcher does not see git's credential.helper / OS keychain / gh-cli auth,
# so HTTPS fetches to private repos fail even when the system `git` succeeds.
# Switching to git-fetch-with-cli delegates to the system git, which honors
# whatever auth the developer (or CI runner) has configured.
#
# CI: ci.yml sets a `git config --global url.<...>.insteadOf` rule that
# injects the OSTK_CRATES PAT for HTTPS fetches to github.com.
#
# Local dev: any of the following just works —
#   - macOS keychain credential helper (Apple's git default)
#   - `gh auth login` (sets up a credential helper at user level)
#   - `git config --global url."git@github.com:".insteadOf "https://github.com/"`
#     to route HTTPS through SSH instead.
[net]
git-fetch-with-cli = true
